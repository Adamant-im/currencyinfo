services:
  app:
    container_name: currencyinfo
    # Published on every stable release for linux/amd64 and linux/arm64.
    # Pin an exact version in production, for example `:4.2.0`, so an upgrade is a deliberate act.
    image: ghcr.io/adamant-im/currencyinfo:latest
    # Contributors and platforms outside the published manifest: comment out `image` above and
    # uncomment this to build from the checkout instead.
    # build:
    #   context: .
    restart: always
    ports:
      - '36661:36661'
    depends_on:
      - mongodb
    volumes:
      # The image runs as the unprivileged `node` user (UID/GID 1000) and Compose cannot change the
      # ownership of a bind mount. Run `sudo chown 1000:1000 config.jsonc` on the host before the first
      # start, otherwise a restricted config file is unreadable inside the container.
      - ./config.jsonc:/usr/src/currencyinfo/config.jsonc:ro
    networks:
      - app_network

  mongodb:
    container_name: mongodb
    # Pinned to a supported major version. `latest` would silently carry the database across a
    # major upgrade on the next `docker compose pull`.
    image: 'mongo:8.0'
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    command: --quiet --logpath /dev/null

networks:
  app_network:

volumes:
  mongo_data:
